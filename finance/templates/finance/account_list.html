{% extends "core_ui/base.html" %}
{% block title %}Hesaplar{% endblock %}
{% block content %}
<h1>Hesaplar</h1>
<a href="{% url 'finance:account_create' %}" class="btn btn-success mb-3">Yeni Hesap Ekle</a>
<ul>
  {% for account in accounts %}
    <li>
      <a href="{% url 'finance:account_detail' account.pk %}">{{ account.code }} - {{ account.name }}</a>
    </li>
  {% empty %}
    <li>Hiç hesap yok.</li>
  {% endfor %}
</ul>
{% endblock %}
