version: '3.8'

services:
  finasis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finasis-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # Sadece localhost'tan erişilebilir (Nginx üzerinden)
    environment:
      # Django Ayarları
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=finasis.com.tr,www.finasis.com.tr
      - DJANGO_SITE_BASE_URL=https://finasis.com.tr
      - DJANGO_CSRF_TRUSTED_ORIGINS=https://finasis.com.tr,https://www.finasis.com.tr
      
      # Veritabanı
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_NAME=finasis
      - DJANGO_DB_USER=finasis
      - DJANGO_DB_PASSWORD=${DJANGO_DB_PASSWORD}
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
      - DJANGO_DB_CONN_MAX_AGE=60
      - DJANGO_DB_SSL_REQUIRED=False
      
      # Redis
      - USE_REDIS=True
      - REDIS_URL=redis://redis:6379/0
      
      # Port
      - PORT=8080
      
      # Gunicorn ayarları
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-8}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      
      # Diğer
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MPLCONFIGDIR=/tmp/matplotlib-cache
      
      # Email (gerekirse güncelleyin)
      - DJANGO_EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - DJANGO_DEFAULT_FROM_EMAIL=FinAsis <noreply@finasis.com.tr>
      - DJANGO_EMAIL_HOST=${DJANGO_EMAIL_HOST:-smtp.gmail.com}
      - DJANGO_EMAIL_PORT=${DJANGO_EMAIL_PORT:-587}
      - DJANGO_EMAIL_USE_TLS=True
      - DJANGO_EMAIL_HOST_USER=${DJANGO_EMAIL_HOST_USER:-}
      - DJANGO_EMAIL_HOST_PASSWORD=${DJANGO_EMAIL_HOST_PASSWORD:-}
      
      # Security
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      
      # Sentry (opsiyonel)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=production
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - finasis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: finasis-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=finasis
      - POSTGRES_USER=finasis
      - POSTGRES_PASSWORD=${DJANGO_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finasis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finasis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finasis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - finasis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  finasis-network:
    driver: bridge

