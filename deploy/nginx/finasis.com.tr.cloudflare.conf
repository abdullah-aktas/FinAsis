# Cloudflare IP listesini dahil et
include /etc/nginx/cloudflare-ips-v4.conf;
include /etc/nginx/cloudflare-ips-v6.conf;

# HTTP'den HTTPS'e yönlendirme (Cloudflare üzerinden)
server {
    listen 80;
    listen [::]:80;
    server_name finasis.com.tr www.finasis.com.tr;
    
    # Let's Encrypt doğrulama için (Cloudflare proxy kapalıyken)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Cloudflare üzerinden geliyorsa HTTPS'e yönlendir
    # Cloudflare zaten HTTP'yi HTTPS'e yönlendiriyor, ama yine de burada da yapıyoruz
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS yapılandırması (Cloudflare Origin Certificate ile)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finasis.com.tr www.finasis.com.tr;

    # Cloudflare Origin Certificate (veya Let's Encrypt)
    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    
    # Alternatif: Let's Encrypt kullanıyorsanız:
    # ssl_certificate /etc/letsencrypt/live/finasis.com.tr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/finasis.com.tr/privkey.pem;
    
    # SSL ayarları (modern ve güvenli)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (Cloudflare bazılarını zaten ekliyor, ama yine de ekliyoruz)
    # Not: X-Forwarded-Proto Cloudflare tarafından otomatik eklenir
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Cloudflare için özel header'lar
    # CF-Connecting-IP: Gerçek kullanıcı IP'si (real_ip_header ile otomatik)
    # CF-Ray: Cloudflare request ID
    # CF-Visitor: HTTPS bilgisi

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # Client body size limit (dosya yükleme için)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Timeout ayarları
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Static dosyalar (Nginx'ten direkt servis edilir, Cloudflare cache'ler)
    location /static/ {
        alias /opt/finasis/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Cloudflare için cache header'ları
        add_header CF-Cache-Status "HIT" always;
    }

    # Media dosyalar
    location /media/ {
        alias /opt/finasis/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        alias /opt/finasis/staticfiles/favicon.ico;
        expires 7d;
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location = /robots.txt {
        alias /opt/finasis/staticfiles/robots.txt;
        expires 1d;
        access_log off;
        log_not_found off;
    }

    # API endpoint'leri (cache yapma)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cloudflare gerçek IP'si
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # Cache yapma
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        
        # WebSocket desteği
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering
        proxy_buffering off;
    }

    # Admin panel (cache yapma)
    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cloudflare gerçek IP'si
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        # Cache yapma
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Django uygulaması (ana uygulama)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cloudflare gerçek IP'si (en önemli kısım)
        # real_ip_header CF-Connecting-IP; zaten cloudflare-ips.conf'da tanımlı
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        
        # WebSocket desteği (Django Channels için)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering ayarları
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Error handling
        proxy_intercept_errors off;
    }

    # Health check endpoint (Cloudflare health check için)
    location /health/ {
        proxy_pass http://127.0.0.1:8080/health/;
        access_log off;
        add_header Cache-Control "no-cache";
    }
}

