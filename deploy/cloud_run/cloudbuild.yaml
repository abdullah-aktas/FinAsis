timeout: "2400s"
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PYTHON_VERSION: "3.11"
  _REGION: "europe-west1"
  _SERVICE: "finasis-api"  # Container image name
  _CLOUD_RUN_SERVICE: "finasis-prod"  # Cloud Run service name (can be different from image name)
  _REPOSITORY: "finasis-app"
  _IMAGE_TAG: "latest"
  _CLOUD_RUN_ENV_VARS: ""
  _CLOUD_RUN_SECRETS: ""
  _CLOUD_SQL_CONNECTION: "finasis-478502:europe-west1:finasis-db"  # Cloud SQL connection name

steps:
  - name: "python:${_PYTHON_VERSION}"
    id: "Install dependencies & readiness check"
    entrypoint: "bash"
    env:
      - "DJANGO_SETTINGS_MODULE=config.settings"
      - "DJANGO_SECRET_KEY=test-secret-key-for-cloud-build"
      - "DJANGO_DEBUG=False"
      - "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1"
    args:
      - "-c"
      - |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Temel Django kontrolleri (veritabanı gerektirmez)
        python manage.py check --deploy || echo "Warning: Django check failed, continuing..."
        # Static dosyaların toplanabilirliğini kontrol et (dry-run, veritabanı gerektirmez)
        python manage.py collectstatic --dry-run --noinput || echo "Warning: collectstatic dry-run failed, continuing..."

  - name: "gcr.io/cloud-builders/docker"
    id: "Build container image"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "Push container image"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "Deploy to Cloud Run"
    entrypoint: "bash"
    env:
      - "CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT="
    args:
      - "-c"
      - |
        set -euo pipefail
        # Cloud Build service account'unu kullan (varsayılan)
        # Compute service account yerine Cloud Build service account kullanılacak
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"
        DEPLOY_ARGS=(
          "--image=$${IMAGE}"
          "--service=${_CLOUD_RUN_SERVICE}"
          "--region=${_REGION}"
          "--platform=managed"
          "--allow-unauthenticated"
          "--execution-environment=gen2"
          "--memory=2Gi"
          "--cpu=2"
          "--timeout=300"
          "--concurrency=40"
          "--min-instances=1"
          "--max-instances=10"
        )

        # Default environment variables (Matplotlib cache ve Python ayarları)
        DEFAULT_ENV_VARS="MPLCONFIGDIR=/tmp/matplotlib-cache,PYTHONUNBUFFERED=1,PYTHONDONTWRITEBYTECODE=1"
        
        # Database environment variables (PostgreSQL için)
        # Not: Cloud SQL connection name varsa, HOST otomatik set edilecek
        DB_ENV_VARS="DJANGO_DB_ENGINE=django.db.backends.postgresql,DJANGO_DB_NAME=finasis,DJANGO_DB_USER=finasis-app,DJANGO_DEBUG=0"
        
        # Cloud SQL connection varsa database host'u set et
        if [ -n "${_CLOUD_SQL_CONNECTION}" ]; then
          DB_ENV_VARS="$${DB_ENV_VARS},DJANGO_DB_HOST=/cloudsql/${_CLOUD_SQL_CONNECTION}"
        fi
        
        # Tüm environment variables'ı birleştir
        ALL_ENV_VARS="$${DEFAULT_ENV_VARS},$${DB_ENV_VARS}"
        
        if [ -n "${_CLOUD_RUN_ENV_VARS}" ]; then
          # Mevcut env vars ile birleştir
          ALL_ENV_VARS="$${ALL_ENV_VARS},${_CLOUD_RUN_ENV_VARS}"
        fi
        
        # Mevcut environment variables'ları koru ve yeni olanları ekle/güncelle
        DEPLOY_ARGS+=("--update-env-vars=$${ALL_ENV_VARS}")

        if [ -n "${_CLOUD_RUN_SECRETS}" ]; then
          DEPLOY_ARGS+=("--set-secrets=${_CLOUD_RUN_SECRETS}")
        fi

        if [ -n "${_CLOUD_SQL_CONNECTION}" ]; then
          DEPLOY_ARGS+=("--add-cloudsql-instances=${_CLOUD_SQL_CONNECTION}")
        fi

        # Cloud Build service account ile deploy et
        gcloud run deploy "$${DEPLOY_ARGS[@]}"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"

