{% extends 'base.html' %}

{% block title %}FinAsis - Yapay Zeka Önerileri{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <h1 class="mb-4">Yapay Zeka Önerileri</h1>
            <div class="card border-ai">
                <div class="card-body">
                    <h5 class="card-title text-ai">
                        <i class="fas fa-robot"></i> Kişiselleştirilmiş Finansal Öneriler
                    </h5>
                    <p class="card-text">
                        Yapay zeka asistanımız, finansal durumunuzu analiz ederek size özel öneriler sunar.
                    </p>
                    <form id="recommendation-form" method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-3 mb-2">
                                <label>Gelir</label>
                                <input type="number" step="0.01" class="form-control" name="income" required>
                            </div>
                            <div class="col-md-3 mb-2">
                                <label>Gider</label>
                                <input type="number" step="0.01" class="form-control" name="expenses" required>
                            </div>
                            <div class="col-md-3 mb-2">
                                <label>Birikim</label>
                                <input type="number" step="0.01" class="form-control" name="savings" required>
                            </div>
                            <div class="col-md-3 mb-2">
                                <label>Hedef</label>
                                <select class="form-control" name="goals">
                                    <option value="investment">Yatırım</option>
                                    <option value="savings">Birikim</option>
                                    <option value="debt">Borç</option>
                                    <option value="retirement">Emeklilik</option>
                                    <option value="">Diğer</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success mt-3 w-100">Öneri Al</button>
                    </form>
                    <div id="recommendation-result" class="mt-4" style="display:none;">
                        <div class="alert alert-info" id="recommendation-text"></div>
                        <div class="model-info" id="model-info"></div>
                    </div>
                    <div id="recommendation-error" class="alert alert-danger mt-3" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
$('#recommendation-form').on('submit', function(e) {
    e.preventDefault();
    $('#recommendation-result').hide();
    $('#recommendation-error').hide();
    let data = {
        income: parseFloat($('input[name="income"]').val()),
        expenses: parseFloat($('input[name="expenses"]').val()),
        savings: parseFloat($('input[name="savings"]').val()),
        goals: $('select[name="goals"]').val()
    };
    const csrfToken = $('input[name="csrfmiddlewaretoken"]').val();
    fetch('/ai-assistant/ml/recommendation/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify(data)
    })
    .then(resp => resp.json())
    .then(data => {
        if (data.error) {
            $('#recommendation-error').text(data.error).show();
        } else {
            $('#recommendation-text').text(data.recommendation);
            let modelInfo = '';
            if (data.model_version) {
                modelInfo += `<b>Model Versiyonu:</b> ${data.model_version}<br>`;
            }
            if (data.model_parameters) {
                modelInfo += `<b>Model Parametreleri:</b> <pre style='font-size:12px;'>${JSON.stringify(data.model_parameters, null, 2)}</pre>`;
            }
            $('#model-info').html(modelInfo);
            $('#recommendation-result').show();
        }
    })
    .catch(err => {
        $('#recommendation-error').text('Sunucu hatası: ' + err).show();
    });
});
</script>
{% endblock %}
