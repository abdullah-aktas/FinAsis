{% extends "ai_assistant/base.html" %}

{% block ai_assistant_content %}
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Öneri Kaydını Sil</h5>
    </div>
    <div class="card-body">
        <p>"{{ object.title }}" başlıklı öneri kaydını silmek istediğinizden emin misiniz?</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <a href="{% url 'ai_assistant:recommendation_list' %}" class="btn btn-secondary">İptal</a>
                <button type="submit" class="btn btn-danger">Evet, Sil</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
