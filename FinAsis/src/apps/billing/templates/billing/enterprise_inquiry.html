{% extends 'common/base.html' %}
{% block title %}Teklif Talebi{% endblock %}
{% block content %}
<div class="container py-5">
  <h2>Teklif / İletişim</h2>
  {% if plan %}
    <p>Plan: <strong>{{ plan.name }}</strong></p>
    <p class="text-secondary">Kurumsal ihtiyaçlarınıza göre özel fiyatlandırma ve paket oluşturuyoruz.</p>
  {% endif %}
  <form method="post">{% csrf_token %}
    <div class="row">
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Ad Soyad</label>
          <input name="name" class="form-control" value="{{ request.user.get_full_name|default:request.user.username }}" />
        </div>
      </div>
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">E-posta</label>
          <input name="email" type="email" class="form-control" value="{{ request.user.email }}" />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Şirket</label>
          <input name="company" class="form-control" value="{{ request.user.company.name|default:'' }}" />
        </div>
      </div>
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Telefon</label>
          <input name="phone" class="form-control" />
        </div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Mesaj</label>
      <textarea name="message" class="form-control" rows="5" placeholder="İhtiyaçlarınızı kısaca anlatabilirsiniz..."></textarea>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Teklif Talep Et</button>
      <a href="mailto:{{ settings.SALES_EMAIL|default:'sales@finasis.local' }}?subject=Enterprise%20Talebi" class="btn btn-outline-secondary">E-posta</a>
    </div>
  </form>
</div>
{% endblock %}
