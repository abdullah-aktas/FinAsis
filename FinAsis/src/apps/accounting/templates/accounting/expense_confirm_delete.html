{% extends "core_ui/base.html" %}
{% block title %}Gider Sil{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Gideri Sil</h2>
    <p><strong>{{ expense.get_category_display }} - {{ expense.amount }}₺</strong> giderini silmek istediğinize emin misiniz?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Evet, Sil</button>
        <a href="{% url 'accounting:expense_list' %}" class="btn btn-secondary">Vazgeç</a>
    </form>
</div>
{% endblock %}
