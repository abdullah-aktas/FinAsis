{% extends "core_ui/base.html" %}
{% block title %}Banka Hareketi Sil{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Banka Hareketini Sil</h2>
    <p><strong>{{ transaction.account.bank_name }} - {{ transaction.amount }}₺</strong> hareketini silmek istediğinize emin misiniz?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Evet, Sil</button>
        <a href="{% url 'accounting:banktransaction_list' %}" class="btn btn-secondary">Vazgeç</a>
    </form>
</div>
{% endblock %}
