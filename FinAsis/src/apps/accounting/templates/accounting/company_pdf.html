<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Şirket PDF</title>
    <style>
        body { font-family: DejaVu Sans, Arial, sans-serif; margin: 2em; }
        h2 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background: #f5f5f5; text-align: left; }
    </style>
</head>
<body>
    <h2>Şirket Detayları</h2>
    <table>
        <tr><th>ID</th><td>{{ company.id }}</td></tr>
        <tr><th>Adı</th><td>{{ company.name }}</td></tr>
        <tr><th>Sektör</th><td>{{ company.sector }}</td></tr>
        <tr><th>Vergi No</th><td>{{ company.tax_number }}</td></tr>
        <tr><th>Adres</th><td>{{ company.address }}</td></tr>
        <tr><th>Telefon</th><td>{{ company.phone }}</td></tr>
        <tr><th>Email</th><td>{{ company.email }}</td></tr>
        <tr><th>Web</th><td>{{ company.website }}</td></tr>
        <tr><th>Oluşturulma</th><td>{{ company.created_at|date:'d.m.Y H:i' }}</td></tr>
    </table>
</body>
</html>
