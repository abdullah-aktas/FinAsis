{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Tedarikçiler</h3>
  <a class="btn btn-primary btn-sm mb-2" href="{% url 'accounting:vendor_create' %}">Yeni Tedarikçi</a>
  <table class="table table-sm table-striped">
    <thead>
      <tr>
        <th>Ad</th>
        <th>Vergi No</th>
        <th>Telefon</th>
        <th>E-posta</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for v in vendors %}
        <tr>
          <td><a href="{% url 'accounting:vendor_detail' v.id %}">{{ v.name }}</a></td>
          <td>{{ v.tax_number }}</td>
          <td>{{ v.phone }}</td>
          <td>{{ v.email }}</td>
          <td>
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'accounting:vendor_update' v.id %}">Düzenle</a>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="5">Kayıt bulunamadı</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
