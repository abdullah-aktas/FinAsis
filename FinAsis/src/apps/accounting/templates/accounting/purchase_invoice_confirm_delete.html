{% extends "core_ui/base.html" %}
{% block content %}
<div class="container py-4">
  <h3>Alış Faturası Sil</h3>
  <p>{{ invoice.invoice_number }} kaydını silmek istediğinize emin misiniz?</p>
  <form method="post">{% csrf_token %}
    <button type="submit" class="btn btn-danger btn-sm">Sil</button>
    <a class="btn btn-link btn-sm" href="{% url 'accounting:purchase_invoice_detail' invoice.id %}">İptal</a>
  </form>
</div>
{% endblock %}
