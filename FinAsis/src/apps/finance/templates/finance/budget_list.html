{% extends 'base.html' %}
{% block title %}Bütçeler{% endblock %}
{% block content %}
<h1>Bütçeler</h1>
<a href="{% url 'finance:budget_create' %}" class="btn btn-success mb-3">Yeni Bütçe Ekle</a>
<ul>
  {% for budget in budgets %}
    <li>
      <a href="{% url 'finance:budget_detail' budget.pk %}">{{ budget.name }} ({{ budget.start_date }} - {{ budget.end_date }})</a>
    </li>
  {% empty %}
    <li>Hiç bütçe yok.</li>
  {% endfor %}
</ul>
{% endblock %}
