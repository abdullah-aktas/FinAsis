{% extends "core_ui/base.html" %}
{% block title %}Borsa Simülasyonu{% endblock %}
{% block content %}
<div class="container my-5">
    <h1>Borsa Simülasyonu</h1>
    <div class="row">
        <div class="col-md-8">
            <table class="table table-striped" id="stock-table">
                <thead><tr><th>Hisse</th><th>Fiyat</th><th>Al</th><th>Sat</th></tr></thead>
                <tbody>
                    <tr><td>FNS</td><td id="fns-price">100</td><td><button onclick="buyStock('FNS')">Al</button></td><td><button onclick="sellStock('FNS')">Sat</button></td></tr>
                    <tr><td>BNK</td><td id="bnk-price">200</td><td><button onclick="buyStock('BNK')">Al</button></td><td><button onclick="sellStock('BNK')">Sat</button></td></tr>
                    <tr><td>TEK</td><td id="tek-price">150</td><td><button onclick="buyStock('TEK')">Al</button></td><td><button onclick="sellStock('TEK')">Sat</button></td></tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-4">
            <h4>Portföy</h4>
            <ul id="portfolio-list"></ul>
            <p>Bakiye: <span id="balance">10000</span> TL</p>
        </div>
    </div>
</div>
<script>
let balance = 10000;
let portfolio = {FNS:0, BNK:0, TEK:0};
let prices = {FNS:100, BNK:200, TEK:150};
function updatePortfolio() {
    document.getElementById('balance').textContent = balance;
    let html = '';
    for (let s in portfolio) html += `<li>${s}: ${portfolio[s]}</li>`;
    document.getElementById('portfolio-list').innerHTML = html;
}
function buyStock(sym) {
    if (balance >= prices[sym]) { balance -= prices[sym]; portfolio[sym]++; updatePortfolio(); }
}
function sellStock(sym) {
    if (portfolio[sym] > 0) { balance += prices[sym]; portfolio[sym]--; updatePortfolio(); }
}
updatePortfolio();
</script>
{% endblock %}
