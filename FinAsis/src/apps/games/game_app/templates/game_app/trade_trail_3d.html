{% extends "core_ui/base.html" %}
{% block title %}Ticaretin İzinde 3D{% endblock %}
{% block content %}
<div class="container my-5">
    <h1>Ticaretin İzinde 3D (Web Demo)</h1>
    <div id="step1">
        <h4>Karakter Seçimi</h4>
        <select id="character">
            <option value="businessman">İş İnsanı</option>
            <option value="student">Öğrenci</option>
            <option value="teacher">Öğretmen</option>
            <option value="retiree">Emekli</option>
        </select>
        <button onclick="nextStep()">Devam</button>
    </div>
    <div id="step2" style="display:none;">
        <h4>Şirket Kur</h4>
        <input type="text" id="company" placeholder="Şirket Adı">
        <select id="companyType">
            <option value="perakende">Perakende</option>
            <option value="toptan">Toptan</option>
            <option value="uretim">Üretim</option>
        </select>
        <button onclick="startGame()">Oyuna Başla</button>
    </div>
    <div id="gameArea" style="display:none;">
        <h4>Şirket: <span id="companyName"></span> | Tür: <span id="companyTypeName"></span></h4>
        <p>Para: <span id="money">10000</span> TL</p>
        <button onclick="trade()">Ticaret Yap (Kazanç: 500 TL)</button>
        <div class="mt-4">
            <h5>3D Görünüm</h5>
            <div id="three-container" style="width:100%; height:60vh; background:#000; border-radius:8px;"></div>
        </div>
        <div class="row g-3 mt-3">
            <div class="col-md-3">
                <label class="form-label">Çıkış Şehri</label>
                <select id="fromCitySelect" class="form-select"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Varış Şehri</label>
                <select id="toCitySelect" class="form-select"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Ürün</label>
                <select id="productSelect" class="form-select"></select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Miktar</label>
                <input id="amountInput" type="number" min="1" value="1" class="form-control" />
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button id="doTradeBtn" class="btn btn-success w-100">Gerçek Ticaret</button>
            </div>
        </div>
    </div>
</div>
<script>
let money = 10000;
function nextStep() {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
}
function startGame() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('companyName').textContent = document.getElementById('company').value;
    document.getElementById('companyTypeName').textContent = document.getElementById('companyType').value;
}
function trade() {
    money += 500;
    document.getElementById('money').textContent = money;
}
</script>
<!-- Three.js from CDN (allowed by CSP) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.min.js"></script>
<script src="/static/js/trade3d.js"></script>
{% endblock %}
