{% extends "core_ui/base.html" %}
{% block content %}
<section class="py-5 bg-gradient" style="background: linear-gradient(135deg,#f8fff9 0%, #e0f7fa 100%);">
  <div class="container text-center">
    <h1 class="display-5 fw-bold text-warning animate__animated animate__fadeInDown">Uzman Görüşleri</h1>
    <p class="lead mb-4 animate__animated animate__fadeInUp">Finansal analiz ve tavsiyeler uzmanlardan!</p>
    <div class="card p-4 animate__animated animate__fadeInUp">
      <h5 class="fw-bold">Örnek Uzman Yorumu</h5>
      <p>Burada uzman görüşleri ve analizler listelenecek.</p>
    </div>
    <div class="mt-5">
      <span class="badge bg-warning text-dark fs-6 animate__animated animate__bounce">Analiz</span>
      <span class="badge bg-success fs-6 animate__animated animate__bounce">Uzman</span>
    </div>
  </div>
</section>
{% endblock %}
