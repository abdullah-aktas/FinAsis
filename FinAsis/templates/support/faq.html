{% extends "base.html" %}
{% block content %}
<section class="py-5 bg-gradient" style="background: linear-gradient(135deg,#f8fff9 0%, #e0f7fa 100%);">
  <div class="container text-center">
    <h1 class="display-5 fw-bold text-success animate__animated animate__fadeInDown">Sıkça Sorulan Sorular</h1>
    <p class="lead mb-4 animate__animated animate__fadeInUp">En çok merak edilen sorular ve yanıtları burada!</p>
    <div class="card p-4 animate__animated animate__fadeInUp">
      <h5 class="fw-bold">Örnek Soru</h5>
      <p>Burada SSS içerikleri listelenecek.</p>
    </div>
    <div class="mt-5">
      <span class="badge bg-success fs-6 animate__animated animate__bounce">Yardımcı</span>
      <span class="badge bg-info fs-6 animate__animated animate__bounce">Hızlı</span>
    </div>
  </div>
</section>
{% endblock %}
