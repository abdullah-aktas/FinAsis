{% extends "core_ui/base.html" %}
{% block content %}
<section class="py-5 bg-gradient" style="background: linear-gradient(135deg,#e0f7fa 0%, #f8fff9 100%);">
  <div class="container text-center">
    <h1 class="display-5 fw-bold text-info animate__animated animate__fadeInDown">Canlı Destek</h1>
    <p class="lead mb-4 animate__animated animate__fadeInUp">Uzman ekibimizle anında iletişim kurun!</p>
    <div class="card p-4 animate__animated animate__fadeInUp">
      <h5 class="fw-bold">Canlı Destek Paneli</h5>
      <p>Burada canlı destek içerikleri ve iletişim formu olacak.</p>
    </div>
    <div class="mt-5">
      <span class="badge bg-info fs-6 animate__animated animate__bounce">Hızlı</span>
      <span class="badge bg-success fs-6 animate__animated animate__bounce">Yardımcı</span>
    </div>
  </div>
</section>
{% endblock %}
