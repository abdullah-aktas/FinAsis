{% extends "base.html" %}
{% block content %}
<section class="py-5 bg-gradient" style="background: linear-gradient(135deg,#e0f7fa 0%, #f8fff9 100%);">
  <div class="container text-center">
    <h1 class="display-5 fw-bold text-info animate__animated animate__fadeInDown">Sürdürülebilirlik</h1>
    <p class="lead mb-4 animate__animated animate__fadeInUp">Çevre ve topluma duyarlı projelerimiz.</p>
    <div class="card p-4 animate__animated animate__fadeInUp">
      <h5 class="fw-bold">Sürdürülebilir Projeler</h5>
      <p>Burada sürdürülebilirlik projeleri ve hedefleri anlatılacak.</p>
    </div>
    <div class="mt-5">
      <span class="badge bg-info fs-6 animate__animated animate__bounce">Gelecek</span>
      <span class="badge bg-success fs-6 animate__animated animate__bounce">Çevre Dostu</span>
    </div>
  </div>
</section>
{% endblock %}
