{% if breadcrumbs %}
<nav aria-label="breadcrumb" class="bg-body-tertiary border-bottom small" style="--bs-breadcrumb-divider:'>'">
  <ol class="breadcrumb container py-2 mb-0">
    {% for crumb in breadcrumbs %}
      <li class="breadcrumb-item {% if forloop.last %}active{% endif %}" {% if forloop.last %}aria-current="page"{% endif %}>
        {% if crumb.url and not forloop.last %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>{% else %}{{ crumb.label }}{% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
