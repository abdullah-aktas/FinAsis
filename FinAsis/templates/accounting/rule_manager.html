{% extends "core_ui/base.html" %}
{% block content %}
<div class="container">
  <h2>Kural Yöneticisi</h2>
  <div class="row g-3">
    <div class="col-md-6">
      <h5>Öneri Üret</h5>
      <textarea id="samples" class="form-control" rows="4" placeholder='{"texts":["akaryakıt shell"],"ocr":[{"invoice_number":"FTR123"}]}'></textarea>
      <button id="btnSuggest" class="btn btn-primary mt-2">Öneri Al</button>
      <pre id="suggestOut" class="mt-2"></pre>
    </div>
    <div class="col-md-6">
      <h5>Kural Testi</h5>
      <input id="ruleId" class="form-control" placeholder="Rule ID" />
      <textarea id="testText" class="form-control mt-2" rows="3" placeholder="Test metni"></textarea>
      <button id="btnTest" class="btn btn-secondary mt-2">Test Et</button>
      <pre id="testOut" class="mt-2"></pre>
    </div>
  </div>
</div>
<script>
document.getElementById('btnSuggest').onclick = async ()=>{
  try{
    const payload = JSON.parse(document.getElementById('samples').value||'{}');
    const res = await fetch('{% url "accounting:api_rules_suggest" %}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data = await res.json();
    document.getElementById('suggestOut').textContent = JSON.stringify(data,null,2);
  }catch(err){ alert('JSON giriniz'); }
};
document.getElementById('btnTest').onclick = async ()=>{
  const rule_id = document.getElementById('ruleId').value;
  const text = document.getElementById('testText').value;
  const res = await fetch('{% url "accounting:api_rules_test" %}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rule_id, text})});
  const data = await res.json();
  document.getElementById('testOut').textContent = JSON.stringify(data,null,2);
};
</script>
{% endblock %}
