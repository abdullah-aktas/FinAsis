{% extends "management/base_admin.html" %}
{% load crispy_forms_tags %}
{% block admin_content %}
<div class="container my-5">
    <h2>{% if edit %}Şirketi Düzenle{% else %}Yeni Şirket Ekle{% endif %}</h2>

        {% csrf_token %}
        {{ form|crispy }}

    </form>
</div>
{% endblock %}
