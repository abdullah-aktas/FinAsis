{% extends "common/base.html" %}
{% block title %}Ayarlar{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h4 mb-3">Kullanıcı Ayarları</h1>
  <form method="post">
    {% csrf_token %}
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" name="email_notifications" id="email_notifications" {% if settings.email_notifications %}checked{% endif %}>
      <label class="form-check-label" for="email_notifications">E-posta Bildirimleri</label>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="dark_mode" id="dark_mode" {% if settings.dark_mode %}checked{% endif %}>
      <label class="form-check-label" for="dark_mode">Karanlık Mod</label>
    </div>
    <button class="btn btn-primary" type="submit">Kaydet</button>
  </form>
</div>
{% endblock %}
