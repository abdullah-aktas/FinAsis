{% extends "common/base.html" %}
{% load static %}
{% block title %}Giriş Yap{% endblock %}
{% block content %}
<section class="py-5 bg-gradient" style="background: linear-gradient(135deg,#e0f7fa 0%, #f8fff9 100%);">
  <div class="container d-flex flex-column align-items-center justify-content-center" style="min-height:60vh;">
    <div class="card shadow-lg p-4" style="max-width:400px;width:100%;">
      <div class="text-center mb-3">
        <img src="{% static 'common/FinAsis_logo.png' %}" alt="FinAsis" style="height:48px;">
        <h2 class="fw-bold mt-2 text-primary">Giriş Yap</h2>
      </div>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-2">Giriş</button>
      </form>
      <div class="mt-3 text-center">
        <a href="{% url 'accounts:register' %}" class="text-info">Hesabınız yok mu? Kayıt olun</a>
        <br>
        <a href="{% url 'password_reset' %}" class="text-secondary">Şifremi unuttum</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
{% block extra_css %}
<style>
:root {
  --main-bg: #F7FDFB;
  --main-btn: #00B894;
  --main-text: #263238;
  --main-dark: #121212;
  --main-light: #EAEAEA;
  --ui-accent: #6366F1;
  --ui-turq: #00CEC9;
}
body { background: var(--main-bg); color: var(--main-text); }
.btn-primary { background: var(--main-btn); color: #fff; border: none; border-radius: 8px; padding: 0.75rem 2rem; font-weight: 600; }
.login-grid { display: flex; min-height: 100vh; }
.login-illustration { flex: 1; display: flex; align-items: center; justify-content: center; background: #e0f7fa; }
.login-form-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; }
.login-form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 1.2rem; }
.login-form input { border: 1px solid #e0e0e0; border-radius: 8px; padding: 0.75rem 1rem; font-size: 1rem; }
.asistan-tip { margin-top: 2rem; background: #e0f7fa; border-radius: 1rem; padding: 1rem 2rem; display: flex; align-items: center; font-size: 1.1rem; color: var(--main-text); box-shadow: 0 2px 8px rgba(0,184,148,0.08); }
.asistan-icon { font-size: 1.5rem; margin-right: 0.7rem; }
.animated-bounce { animation: bounce 1.2s infinite alternate; }
@keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
@media (max-width: 991px) {
  .login-grid { flex-direction: column; }
  .login-illustration { min-height: 200px; }
}
</style>
{% endblock %}
