{% extends "core_ui/base.html" %}
{% block title %}Yeni Şifre Belirle{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:520px;">
  <h2 class="mb-3">Yeni Şifre Belirle</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100">Şifreyi Güncelle</button>
  </form>
  <p class="mt-3 small"><a href="{% url 'accounts:login' %}">Giriş sayfasına dön</a></p>
</div>
{% endblock %}
