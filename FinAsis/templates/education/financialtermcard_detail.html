{% extends "common/base.html" %}
{% block title %}Terim Detayı{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h4">{{ card.term }}</h1>
  <p class="text-muted">{{ card.description }}</p>
  {% if card.example %}
  <pre class="bg-light p-3">{{ card.example }}</pre>
  {% endif %}
  <div class="mt-3">
    <a class="btn btn-sm btn-outline-primary" href="{% url 'education:financialtermcard_edit' card.pk %}">Düzenle</a>
    <a class="btn btn-sm btn-outline-danger" href="{% url 'education:financialtermcard_delete' card.pk %}">Sil</a>
    <a class="btn btn-sm btn-link" href="{% url 'education:financialtermcard_list' %}">Listeye Dön</a>
  </div>
</div>
{% endblock %}
