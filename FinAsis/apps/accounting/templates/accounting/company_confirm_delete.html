{% extends 'base.html' %}
{% block title %}Şirket Sil{% endblock %}
{% block content %}
<div class="container mt-5">
  <h2>Şirket Sil</h2>
  <div class="alert alert-warning">Bu şirketi silmek üzeresiniz. Lütfen silme gerekçenizi belirtin.</div>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="reason" class="form-label">Silme gerekçesi:</label>
      <textarea class="form-control" id="reason" name="delete_reason" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-danger">Sil</button>
    <a href="{% url 'accounting:company_list' %}" class="btn btn-secondary">Vazgeç</a>
  </form>
</div>
{% endblock %}
