{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Tedarikçi Sil</h3>
  <p>{{ vendor.name }} kaydını silmek istediğinize emin misiniz?</p>
  <form method="post">{% csrf_token %}
    <button type="submit" class="btn btn-danger btn-sm">Sil</button>
    <a class="btn btn-link btn-sm" href="{% url 'accounting:vendor_detail' vendor.id %}">İptal</a>
  </form>
</div>
{% endblock %}
