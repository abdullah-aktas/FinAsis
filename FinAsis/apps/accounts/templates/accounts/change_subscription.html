{% extends "base.html" %}
{% block title %}Abonelik Tipini Değiştir{% endblock %}
{% block content %}
<div class="container my-5">
    <h2>Abonelik Tipini Değiştir</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Kaydet</button>
        <a href="{% url 'accounts:user_profile' %}" class="btn btn-secondary">İptal</a>
    </form>
</div>
{% endblock %}
