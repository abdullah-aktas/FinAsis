{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Şirket Bilgilerini Düzenle" %} | FinAsis{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-xl-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-4">{% trans "Şirket Bilgilerini Düzenle" %}</h3>
        <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="name" class="form-label">{% trans "Şirket Adı" %}</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ company.name|default:'' }}" required>
          </div>
          <div class="mb-3">
            <label for="sector" class="form-label">{% trans "Sektör" %}</label>
            <input type="text" class="form-control" id="sector" name="sector" value="{{ company.sector|default:'' }}">
          </div>
          <div class="mb-3">
            <label for="tax_number" class="form-label">{% trans "Vergi Numarası" %}</label>
            <input type="text" class="form-control" id="tax_number" name="tax_number" value="{{ company.tax_number|default:'' }}">
          </div>
          <div class="mb-3">
            <label for="address" class="form-label">{% trans "Adres" %}</label>
            <textarea class="form-control" id="address" name="address" rows="2">{{ company.address|default:'' }}</textarea>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">{% trans "Telefon" %}</label>
            <input type="text" class="form-control" id="phone" name="phone" value="{{ company.phone|default:'' }}">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">{% trans "E-posta" %}</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ company.email|default:'' }}">
          </div>
          <div class="mb-3">
            <label for="logo" class="form-label">{% trans "Logo" %}</label>
            {% if company.logo %}
              <div class="mb-2"><img src="{{ company.logo.url }}" alt="Logo" style="height:48px;max-width:100px;object-fit:contain;"></div>
            {% endif %}
            <input class="form-control" type="file" id="logo" name="logo" accept="image/*">
          </div>
          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'accounts:user_profile' %}" class="btn btn-outline-secondary">{% trans "İptal" %}</a>
            <button type="submit" class="btn btn-primary">{% trans "Kaydet" %}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
