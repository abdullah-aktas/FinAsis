{% extends 'base.html' %}

{% block title %}Finansal Quiz{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="mb-4">Finansal Bilgi Quiz'i</h2>
                    <form id="quiz-form">
                        <div class="mb-3">
                            <label class="form-label">1. Borsa nedir?</label>
                            <input type="text" class="form-control" name="q1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">2. Faiz oranı neyi ifade eder?</label>
                            <input type="text" class="form-control" name="q2">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">3. Enflasyon nedir?</label>
                            <input type="text" class="form-control" name="q3">
                        </div>
                        <button type="submit" class="btn btn-primary">Cevapları Gönder</button>
                    </form>
                    <div id="quiz-result" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('quiz-form').onsubmit = function(e) {
    e.preventDefault();
    document.getElementById('quiz-result').innerHTML = '<div class="alert alert-success">Cevaplarınız kaydedildi! (Demo)</div>';
};
</script>
{% endblock %}
