{% extends "common/base.html" %}
{% block title %}Yönetim Paneli{% endblock %}
{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/yonetim/">FinAsis Yönetim</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="adminNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link {% if request.path == '/yonetim/' %}active{% endif %}" href="/yonetim/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {% if '/yonetim/kullanicilar' in request.path %}active{% endif %}" href="/yonetim/kullanicilar/">Kullanıcılar</a></li>
        <li class="nav-item"><a class="nav-link {% if '/yonetim/sirketler' in request.path %}active{% endif %}" href="/yonetim/sirketler/">Şirketler</a></li>
        <li class="nav-item"><a class="nav-link {% if '/yonetim/faturalar' in request.path %}active{% endif %}" href="/yonetim/faturalar/">Faturalar</a></li>
      </ul>
      <a href="/yonetim/kullanicilar/ekle/" class="btn btn-success me-2">+ Kullanıcı</a>
      <span class="navbar-text">{{ request.user.username }}</span>
    </div>
  </div>
</nav>
<div class="container">
  {% block admin_content %}{% endblock %}
</div>
{% endblock %}
