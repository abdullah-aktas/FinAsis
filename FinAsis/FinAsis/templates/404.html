{% extends "base.html" %}
{% block title %}404 - Sayfa Bulunamadı | FinAsis{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #001f1f, #0d4747);
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 80px 20px;
    }

    .error-code {
        font-size: 10rem;
        font-weight: bold;
        background: linear-gradient(90deg, #00bfa5, #ff9800);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 10px rgba(0, 191, 165, 0.5);
    }

    .error-message {
        font-size: 2rem;
        margin-bottom: 20px;
        color: #ffffff;
    }

    .error-description {
        font-size: 1.2rem;
        color: #cccccc;
        margin-bottom: 30px;
        text-align: center;
    }

    .back-home-btn {
        background-color: transparent;
        border: 2px solid #00bfa5;
        color: #00bfa5;
        padding: 10px 30px;
        border-radius: 50px;
        transition: 0.3s ease-in-out;
        text-decoration: none;
        font-weight: bold;
    }

    .back-home-btn:hover {
        background-color: #00bfa5;
        color: #ffffff;
    }

    .logo {
        max-width: 140px;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 10px #00bfa5);
    }
</style>

<div class="error-container text-center">
    <img src="{% static 'common/FinAsis_logo.png' %}" alt="FinAsis Logo" class="logo">
    <div class="error-code">404</div>
    <div class="error-message">Sayfa Bulunamadı</div>
    <div class="error-description">
        Üzgünüz, istediğiniz sayfa sistemimizde mevcut değil.<br>
        Lütfen bağlantıyı kontrol edin veya ana sayfaya dönün.
    </div>
    <a href="{% url 'home' %}" class="back-home-btn">Ana Sayfa</a>
</div>
{% endblock %}
