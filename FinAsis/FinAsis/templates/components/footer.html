{% load i18n %}
<!-- Bootstrap Icons CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<footer class="footer mt-auto py-3 bg-white border-top shadow-sm">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
    <span class="text-muted">&copy; {{ now|date:'Y' }} FinAsis. {% trans "Tüm hakları saklıdır." %}</span>
    <div class="d-flex align-items-center">
      <a href="/pricing/" class="text-muted me-3">Fiyatlandırma</a>
      <a href="/legal/" class="text-muted me-3">Yasal Bilgiler</a>
      <a href="/legal/kvkk/" class="text-muted me-3">KVKK</a>
      <a href="/terms/" class="text-muted me-3">Kullanım Şartları</a>
      <span class="mx-2 text-muted">|</span>
      <a href="https://www.linkedin.com/in/finasis/" target="_blank" class="text-muted me-3" aria-label="LinkedIn">
        <i class="bi bi-linkedin fs-5"></i>
      </a>
      <a href="https://www.instagram.com/finasisapp/" target="_blank" class="text-muted me-3" aria-label="Instagram">
        <i class="bi bi-instagram fs-5"></i>
      </a>
      <a href="https://x.com/finasis" target="_blank" class="text-muted me-3" aria-label="X (Twitter)">
        <i class="bi bi-twitter-x fs-5"></i>
      </a>
      <a href="https://www.youtube.com/@FinAsisApp" target="_blank" class="text-muted" aria-label="YouTube">
        <i class="bi bi-youtube fs-5"></i>
      </a>
    </div>
  </div>
  <script>
    // Tema toggle: basit örnek
    (function(){
      var btn = document.getElementById('theme-toggle');
      if(!btn) return;
      function setTheme(t){ document.documentElement.dataset.theme=t; localStorage.setItem('theme',t); btn.innerHTML = t==='dark'?'<i class="bi bi-brightness-high"></i>':'<i class="bi bi-moon-fill"></i>'; }
      var saved = localStorage.getItem('theme')||'light'; setTheme(saved);
      btn.addEventListener('click', function(){ setTheme((document.documentElement.dataset.theme||'light')==='dark'?'light':'dark'); });
    })();
  </script>
</footer>
