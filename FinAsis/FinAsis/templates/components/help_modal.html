<!-- Yardım Merkezi Modal -->
<div class="modal fade" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content shadow">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title d-flex align-items-center" id="helpModalLabel">
          <i class="bi bi-question-circle me-2 fs-4"></i> Yardım Merkezi
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body">
        <!-- Rol Seçimi -->
        <div class="mb-3">
          <label for="helpRoleSelect" class="form-label fw-semibold">Rolünüzü seçin:</label>
          <select id="helpRoleSelect" class="form-select" aria-label="Kullanıcı rolü">
            <option value="genel">Genel Kullanıcı</option>
            <option value="admin">Yönetici</option>
            <option value="muhasebeci">Muhasebeci</option>
            <option value="calisan">Çalışan</option>
            <option value="ogrenci">Öğrenci</option>
            <option value="ogretmen">Öğretmen</option>
          </select>
        </div>

        <!-- Arama Kutusu -->
        <div class="mb-3">
          <input type="text" id="helpSearch" class="form-control" placeholder="🔍 Sorunuzu veya anahtar kelimeyi yazın..." aria-label="Yardım arama">
        </div>

        <!-- Yardım İçeriği -->
        <div id="helpContent" class="help-content border rounded p-3" tabindex="0" style="max-height: 350px; overflow-y: auto;">
          <p class="text-muted text-center">Yukarıdan rolünüzü seçin ve bir anahtar kelime girin. İlgili yardım içeriği burada görüntülenecek.</p>
        </div>
      </div>

      <div class="modal-footer bg-light">
        <a href="/help/" class="btn btn-link text-decoration-none">
          <i class="bi bi-journal-text me-1"></i> Tüm Dökümantasyon
        </a>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-circle me-1"></i> Kapat
        </button>
      </div>
    </div>
  </div>
</div>
