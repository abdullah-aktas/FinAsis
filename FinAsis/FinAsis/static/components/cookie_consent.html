<div id="cookie-consent" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#263238;color:#fff;padding:1.2rem;display:none;align-items:center;justify-content:center;gap:1rem;">
  <span data-i18n="cookie_message">Bu site çerezleri kullanır. Devam ederek çerez kullanımını kabul etmiş olursunuz.</span>
  <button class="btn-primary" onclick="acceptCookies()" data-i18n="cookie_accept">Kabul Et</button>
  <button class="btn-secondary" onclick="declineCookies()" data-i18n="cookie_decline">Reddet</button>
</div>
<script>
function showCookieConsent() {
  if (!localStorage.getItem('finasis-cookie')) {
    document.getElementById('cookie-consent').style.display = 'flex';
  }
}
function acceptCookies() {
  localStorage.setItem('finasis-cookie', 'accepted');
  document.getElementById('cookie-consent').style.display = 'none';
}
function declineCookies() {
  localStorage.setItem('finasis-cookie', 'declined');
  document.getElementById('cookie-consent').style.display = 'none';
}
window.addEventListener('DOMContentLoaded', showCookieConsent);
</script>
