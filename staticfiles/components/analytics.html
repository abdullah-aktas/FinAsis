<!-- Matomo (Kendi sunucunda çalışmalı) -->
<script>
  var _paq = window._paq = window._paq || [];
  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  _paq.push(['enableHeartBeatTimer']); // Aktif kullanıcı takibi
  (function() {
    var u="https://matomo.example.com/";
    _paq.push(['setTrackerUrl', u + 'matomo.php']);
    _paq.push(['setSiteId', '1']);
    var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
    g.async=true; g.src=u + 'matomo.js'; s.parentNode.insertBefore(g,s);
  })();
</script>

<!-- Evrensel Event Takip Sistemi -->
<script>
  /**
   * Global olay takip fonksiyonu
   * @param {string} category - Olay kategorisi (örn: Ürün, Kullanıcı, Yatırım)
   * @param {string} action - Olay eylemi (örn: Satın Al, Giriş Yaptı)
   * @param {string} label - Ek bilgi (örn: Ana Sayfa, Ürün ID:123)
   */
  function trackEvent(category, action, label = '') {
    try {
      if (typeof gtag === 'function') {
        gtag('event', action, {
          event_category: category,
          event_label: label
        });
      }
    } catch (e) { console.warn('Google Analytics takip hatası:', e); }

    try {
      if (typeof _paq !== 'undefined') {
        _paq.push(['trackEvent', category, action, label]);
      }
    } catch (e) { console.warn('Matomo takip hatası:', e); }

    try {
      if (typeof plausible === 'function') {
        plausible(action, {
          props: { category: category, label: label }
        });
      }
    } catch (e) { console.warn('Plausible takip hatası:', e); }
  }
</script>

<!-- Örnek Kullanımlar -->
<script>
  // Yatırımcı sayfası yüklendiğinde otomatik izleme
  window.addEventListener('load', () => {
    if (window.location.pathname.includes('/yatirimci')) {
      trackEvent('Yatırım', 'Sayfa Görüntülendi', 'Yatırımcı Paneli');
    }
  });
