<!-- Bootstrap CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- YARDIM MODALI -->
<div class="modal fade" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="helpModalLabel"><i class="bi bi-question-circle me-2"></i> Yardım Merkezi</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="helpRoleSelect" class="form-label">Rolünüzü seçin:</label>
          <select id="helpRoleSelect" class="form-select" aria-label="Kullanıcı rolü">
            <option value="all">Tüm Roller</option>
            <option value="genel">Genel Kullanıcı</option>
            <option value="admin">Yönetici</option>
            <option value="muhasebeci">Muhasebeci</option>
            <option value="calisan">Çalışan</option>
            <option value="ogrenci">Öğrenci</option>
            <option value="ogretmen">Öğretmen</option>
          </select>
        </div>
        <div class="mb-3">
          <input type="text" id="helpSearch" class="form-control" placeholder="Sorunuzu veya anahtar kelimeyi yazın..." aria-label="Yardım arama">
        </div>
        <div id="helpContent" class="help-content border p-3 rounded bg-light" tabindex="0" style="max-height:350px;overflow:auto;">
          <!-- Yardım içerikleri buraya dinamik olarak gelir -->
        </div>
      </div>
      <div class="modal-footer">
        <a href="/help/" class="btn btn-outline-success btn-sm"><i class="bi bi-book"></i> Tüm Dökümantasyon</a>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
      </div>
    </div>
  </div>
</div>

<!-- JS: Dinamik Yardım Sistemi -->
<script>
const helpArticles = [
  { role: 'genel', title: 'Hesabımı nasıl oluştururum?', content: 'Kayıt sayfasından e-posta ve şifre belirleyerek hesabınızı oluşturabilirsiniz.' },
  { role: 'admin', title: 'Kullanıcı eklemek istiyorum', content: 'Yönetici panelinden "Kullanıcı Ekle" sekmesini kullanabilirsiniz.' },
  { role: 'muhasebeci', title: 'Raporları dışa aktar', content: 'Raporlar sekmesinde "PDF/Excel olarak indir" seçeneği mevcuttur.' },
  { role: 'ogrenci', title: 'Sınav sonuçlarımı göremiyorum', content: 'Eğitim paneline giriş yaptıktan sonra "Sınavlarım" kısmını kontrol edin.' },
  { role: 'ogretmen', title: 'Sınıf listesi nasıl yüklenir?', content: 'Öğretmen panelindeki "Sınıflar" sekmesinden Excel şablon yükleyebilirsiniz.' },
  { role: 'calisan', title: 'Mesai saatleri nasıl girilir?', content: 'Personel modülünde "Zaman Takibi" altında saat girişinizi yapabilirsiniz.' },
  { role: 'genel', title: 'Şifremi unuttum', content: 'Giriş ekranında "Şifremi unuttum" bağlantısını kullanabilirsiniz.' },
];

function renderHelpArticles(roleFilter = 'all', keyword = '') {
  const container = document.getElementById('helpContent');
  container.innerHTML = '';

  const filtered = helpArticles.filter(article => {
    const roleMatch = roleFilter === 'all' || article.role === roleFilter;
    const keywordMatch = keyword === '' || article.title.toLowerCase().includes(keyword) || article.content.toLowerCase().includes(keyword);
    return roleMatch && keywordMatch;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<p class="text-muted">Hiçbir sonuç bulunamadı.</p>`;
    return;
  }

  filtered.forEach(article => {
    const card = document.createElement('div');
    card.classList.add('mb-3');
    card.innerHTML = `
      <h6 class="fw-bold"><i class="bi bi-dot"></i> ${article.title}</h6>
      <p class="text-muted">${article.content}</p>
    `;
    container.appendChild(card);
  });
}

// Dinleme
['helpRoleSelect', 'helpSearch'].forEach(id => {
  document.getElementById(id).addEventListener(id === 'helpSearch' ? 'input' : 'change', () => {
    const role = document.getElementById('helpRoleSelect').value;
    const keyword = document.getElementById('helpSearch').value.toLowerCase();
    renderHelpArticles(role, keyword);
  });
});

document.addEventListener('DOMContentLoaded', () => {
  renderHelpArticles();
});
</script>

<!-- GELECEKTEKİ GELİŞTİRMELER (Yorum Satırı) -->

1. helpArticles dizisini JSON dosyasından veya API'den dinamik olarak almak
2. Giriş yapmış kullanıcıya göre rol varsayılan seçili gelsin (örnek: sessionStorage.getItem('role'))
3. GPT destekli yardım motoru: "Yaz, biz cevaplayalım" kutusu
4. Canlı destek entegresi: WhatsApp, Tawk.to, Zendesk
5. Yardım konusu bulunamazsa mesaj bırakma alanı (e-posta veya form)
6. Çok dilli destek: i18next ile data-i18n destekli içerik dönüşümü
7. Yardım içeriklerini PDF olarak indir seçeneği
-->
