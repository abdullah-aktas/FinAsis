<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erişilebilirlik Paneli</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Yüksek Kontrast Teması */
    .high-contrast {
      background-color: #000 !important;
      color: #fff !important;
    }
    .high-contrast a, .high-contrast .btn {
      background-color: #fff !important;
      color: #000 !important;
      border: 2px solid #fff;
    }
    .high-contrast .card, .high-contrast .navbar, .high-contrast .footer {
      background-color: #111 !important;
      color: #fff !important;
    }

    /* Yazı büyütme sınıfları */
    .font-large {
      font-size: 1.25rem;
    }

    .font-xlarge {
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Erişilebilirlik Butonları -->
  <div class="container mt-3">
    <div class="d-flex gap-2">
      <!-- Kontrast Butonu -->
      <button class="btn btn-secondary" onclick="toggleContrast()" id="contrastToggleBtn" aria-pressed="false" aria-label="Yüksek Kontrast Modu">
        <i class="bi bi-eye"></i> Yüksek Kontrast
      </button>

      <!-- Yazı Büyütme -->
      <button class="btn btn-outline-primary" onclick="increaseFont()" aria-label="Yazıyı Büyüt">
        <i class="bi bi-zoom-in"></i> Yazı +
      </button>

      <!-- Yazı Küçültme -->
      <button class="btn btn-outline-primary" onclick="resetFont()" aria-label="Yazıyı Sıfırla">
        <i class="bi bi-zoom-out"></i> Yazı 0
      </button>

      <!-- Tema Geçişi -->
      <button class="btn btn-dark" onclick="toggleDarkMode()" id="themeToggleBtn">
        <i class="bi bi-moon-stars"></i> Gece/Gündüz
      </button>
    </div>
  </div>

  <!-- Örnek içerik -->
  <div class="container mt-5">
    <div class="card p-4">
      <h1>FinAsis Erişilebilirlik Özellikleri</h1>
      <p>Bu sayfa yüksek kontrast, yazı büyütme ve gece/gündüz modlarını desteklemektedir. Tüm kullanıcılar için erişilebilir deneyim sunar.</p>
    </div>
  </div>

  <!-- JS -->
  <script>
    // Kontrast Modu
    function toggleContrast() {
      const body = document.body;
      const btn = document.getElementById('contrastToggleBtn');
      const isActive = body.classList.toggle('high-contrast');
      btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      localStorage.setItem('contrastMode', isActive ? 'on' : 'off');
    }

    // Yazı Büyütme
    let fontLevel = 0;
    function increaseFont() {
      fontLevel++;
      document.body.classList.remove('font-large', 'font-xlarge');
      if (fontLevel === 1) document.body.classList.add('font-large');
      else if (fontLevel >= 2) document.body.classList.add('font-xlarge');
      localStorage.setItem('fontLevel', fontLevel);
    }

    function resetFont() {
      fontLevel = 0;
      document.body.classList.remove('font-large', 'font-xlarge');
      localStorage.removeItem('fontLevel');
    }

    // Gece/Gündüz Modu
    function toggleDarkMode() {
      const body = document.body;
      const isDark = body.classList.toggle('bg-dark');
      if (isDark) {
        body.classList.add('text-white');
        localStorage.setItem('darkMode', 'on');
      } else {
        body.classList.remove('text-white');
        localStorage.setItem('darkMode', 'off');
      }
    }

    // Tercihleri Yükle
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('contrastMode') === 'on') {
        document.body.classList.add('high-contrast');
        document.getElementById('contrastToggleBtn')?.setAttribute('aria-pressed', 'true');
      }

      if (localStorage.getItem('fontLevel') === '1') {
        fontLevel = 1;
        document.body.classList.add('font-large');
      } else if (localStorage.getItem('fontLevel') === '2') {
        fontLevel = 2;
        document.body.classList.add('font-xlarge');
      }

      if (localStorage.getItem('darkMode') === 'on') {
        document.body.classList.add('bg-dark', 'text-white');
      }
    });
  </script>

</body>
</html>
