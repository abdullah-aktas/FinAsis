<!-- Bootstrap CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- Yardım Butonu (Sabit, Dairesel, Erişilebilir) -->
<button id="helpBtn"
        class="btn btn-success rounded-circle shadow-lg"
        style="position:fixed;bottom:2rem;right:2rem;z-index:1050;width:56px;height:56px;"
        aria-label="Yardım Al" title="Yardım" data-bs-toggle="modal" data-bs-target="#helpModal">
  <i class="bi bi-question-lg fs-3"></i>
</button>

<!-- Yardım Modalı -->
<div class="modal fade" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="helpModalLabel"><i class="bi bi-info-circle me-2"></i> Yardım ve Destek</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body">
        <p>Size nasıl yardımcı olabiliriz? Aşağıdaki sık sorulan konulardan birini seçebilir veya özel mesajınızı bize iletebilirsiniz.</p>
        <ul class="list-group mb-3">
          <li class="list-group-item" onclick="prefillHelp('Giriş yapamıyorum')"><i class="bi bi-box-arrow-in-right text-primary me-2"></i> Giriş yapamıyorum</li>
          <li class="list-group-item" onclick="prefillHelp('Ödeme işlemi başarısız')"><i class="bi bi-credit-card text-warning me-2"></i> Ödeme işlemi başarısız</li>
          <li class="list-group-item" onclick="prefillHelp('Raporlarda eksik veri var')"><i class="bi bi-bar-chart text-info me-2"></i> Raporlarda eksik veri var</li>
          <li class="list-group-item" onclick="prefillHelp('Yeni kullanıcı eklemek istiyorum')"><i class="bi bi-person-plus text-success me-2"></i> Yeni kullanıcı eklemek istiyorum</li>
        </ul>

        <label for="helpTextarea" class="form-label">Sorunuzu veya mesajınızı yazın:</label>
        <textarea id="helpTextarea" class="form-control" rows="4" placeholder="Lütfen açıklayıcı olun..."></textarea>

        <!-- İsteğe bağlı kullanıcı bilgisi -->
        <div class="mt-3">
          <label for="helpEmail" class="form-label">E-posta adresiniz (isteğe bağlı):</label>
          <input type="email" id="helpEmail" class="form-control" placeholder="ornek@finasis.com">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button class="btn btn-success" onclick="submitHelp()">Gönder</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Yardım Fonksiyonları -->
<script>
function prefillHelp(message) {
  document.getElementById("helpTextarea").value = message;
}
