version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: FinAsis/Dockerfile
    command: gunicorn src.config.wsgi:application --bind 0.0.0.0:8000 --workers 2
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: src.config.settings
      USE_SQLITE: "1"
      DEBUG: "0"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
