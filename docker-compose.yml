version: "3.9"
services:
  web:
    build: .
    working_dir: /app
    command: python FinAsis/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONPATH=/app/FinAsis
      - DEBUG="1"
      - USE_SQLITE="0"
      - POSTGRES_DB=finasis
      - POSTGRES_USER=finasis
      - POSTGRES_PASSWORD=finasis
      - POSTGRES_HOST=db
      - POSTGRES_PORT="5432"
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

  worker:
    build: .
    working_dir: /app
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONPATH=/app/FinAsis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

  beat:
    build: .
    working_dir: /app
    command: celery -A config beat -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONPATH=/app/FinAsis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

  flower:
    image: mher/flower:2.0
    command: ["flower", "--broker=redis://redis:6379/0"]
    ports:
      - "5555:5555"
    depends_on:
      - redis

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=finasis
      - POSTGRES_USER=finasis
      - POSTGRES_PASSWORD=finasis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
