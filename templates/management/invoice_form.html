{% extends "management/base_admin.html" %}
{% load bootstrap5 %}
{% block admin_content %}
<div class="container my-5">
    <h2>{% if edit %}Faturayı Düzenle{% else %}Yeni Fatura Ekle{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {% bootstrap_form form layout='vertical' %}
        <button type="submit" class="btn btn-primary">Kaydet</button>
        <a href="/yonetim/faturalar/" class="btn btn-secondary">İptal</a>
    </form>
</div>
{% endblock %}
