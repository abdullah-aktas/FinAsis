{% extends "core_ui/base.html" %}
{% block content %}
<section class="py-5 bg-gradient" style="background: linear-gradient(135deg,#e0f7fa 0%, #f8fff9 100%);">
  <div class="container text-center">
    <h1 class="display-5 fw-bold text-info animate__animated animate__fadeInDown">Girişimcilik</h1>
    <p class="lead mb-4 animate__animated animate__fadeInUp">Başarı hikayeleri ve girişimcilik ipuçları burada!</p>
    <div class="card p-4 animate__animated animate__fadeInUp">
      <h5 class="fw-bold">Örnek Girişimcilik Hikayesi</h5>
      <p>Burada girişimcilik içerikleri listelenecek.</p>
    </div>
    <div class="mt-5">
      <span class="badge bg-info fs-6 animate__animated animate__bounce">İlham</span>
      <span class="badge bg-success fs-6 animate__animated animate__bounce">Başarı</span>
    </div>
  </div>
</section>
{% endblock %}
