{% comment %}
Reusable animated bars/coins illustration
Usage:
{% include "components/illustrations/animated_bars.html" with title="..." desc="..." width=480 height=320 %}
{% endcomment %}
<svg class="img-fluid rounded-3 shadow-sm" width="{{ width|default:'480' }}" height="{{ height|default:'320' }}"
    viewBox="0 0 480 320" role="img" aria-labelledby="animTitle animDesc">
    <title id="animTitle">{{ title|default:'Finansal gösterge paneli animasyonu' }}</title>
    <desc id="animDesc">{{ desc|default:'Yükselen çubuklar ve hareketli paralar ile görsel anlatım.' }}</desc>
    <defs>
        <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f8fbff" />
            <stop offset="100%" stop-color="#eef5ff" />
        </linearGradient>
        <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#0d6efd" />
            <stop offset="100%" stop-color="#0dcaf0" />
        </linearGradient>
        <radialGradient id="coinGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffd666" />
            <stop offset="100%" stop-color="#ffb100" />
        </radialGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.08" />
        </filter>
    </defs>
    <style>
        @keyframes rise {
            from {
                transform: scaleY(0.25);
            }

            to {
                transform: scaleY(1);
            }
        }

        @keyframes floaty {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .bar {
            transform-origin: bottom;
            animation: rise 2.2s ease-in-out infinite alternate;
        }

        .bar.d1 {
            animation-delay: .2s;
        }

        .bar.d2 {
            animation-delay: .4s;
        }

        .bar.d3 {
            animation-delay: .6s;
        }

        .coin {
            animation: floaty 3.5s ease-in-out infinite;
        }

        .coin.d1 {
            animation-delay: .5s;
        }

        .coin.d2 {
            animation-delay: 1s;
        }
    </style>
    <!-- Background -->
    <rect x="0" y="0" width="480" height="320" rx="16" fill="#ffffff" />
    <!-- Panel -->
    <g transform="translate(32,28)" filter="url(#softShadow)">
        <rect x="0" y="0" width="416" height="232" rx="14" fill="url(#panelGrad)" />
        <!-- Grid lines -->
        <g stroke="#dbe6ff" stroke-width="1">
            <path d="M24 48 H392" opacity="0.7" />
            <path d="M24 96 H392" opacity="0.6" />
            <path d="M24 144 H392" opacity="0.5" />
            <path d="M24 192 H392" opacity="0.4" />
        </g>
        <!-- Bars -->
        <g fill="url(#barGrad)">
            <rect class="bar" x="56" y="72" width="24" height="120" rx="6" />
            <rect class="bar d1" x="96" y="52" width="24" height="140" rx="6" />
            <rect class="bar d2" x="136" y="92" width="24" height="100" rx="6" />
            <rect class="bar d3" x="176" y="36" width="24" height="156" rx="6" />
            <rect class="bar d1" x="216" y="84" width="24" height="108" rx="6" />
            <rect class="bar d2" x="256" y="64" width="24" height="128" rx="6" />
            <rect class="bar d3" x="296" y="104" width="24" height="88" rx="6" />
        </g>
        <!-- Baseline -->\n
        <rect x="24" y="216" width="368" height="2" fill="#b9cffb" />
        <!-- Coins -->
        <g>
            <g class="coin" transform="translate(330,36)">
                <circle cx="0" cy="0" r="14" fill="url(#coinGrad)" />
                <circle cx="0" cy="0" r="14" fill="none" stroke="#fff6cc" stroke-width="2" opacity=".65" />
            </g>
            <g class="coin d1" transform="translate(368,68)">
                <circle cx="0" cy="0" r="10" fill="url(#coinGrad)" />
                <circle cx="0" cy="0" r="10" fill="none" stroke="#fff6cc" stroke-width="2" opacity=".65" />
            </g>
            <g class="coin d2" transform="translate(300,22)">
                <circle cx="0" cy="0" r="8" fill="url(#coinGrad)" />
                <circle cx="0" cy="0" r="8" fill="none" stroke="#fff6cc" stroke-width="2" opacity=".65" />
            </g>
        </g>
    </g>
</svg>
