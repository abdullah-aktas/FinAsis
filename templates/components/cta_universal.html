{% load static %}
<section class="py-5 py-lg-6 bg-gradient" aria-labelledby="ctaTitle">
    <style>
        .cta-card {
            border-radius: 16px;
            /* Blue to Orange tint (Bootstrap blue + orange) */
            background: linear-gradient(135deg, rgba(13, 110, 253, .08), rgba(253, 126, 20, .12));
            backdrop-filter: saturate(140%) blur(6px)
        }

        .cta-badge {
            font-weight: 600
        }

        .cta-btn {
            padding: .75rem 1.25rem
        }
    </style>
    <div class="container">
        <div class="cta-card p-4 p-lg-5 shadow-sm">
            <div class="row align-items-center g-4">
                <div class="col-lg-8">
                    <h2 id="ctaTitle" class="h3 h2-lg mb-2">FinAsis ile bugün başlayın</h2>
                    <p class="text-muted mb-0">Hesap açın, 2 dakikada kurulum yapın. Dilediğiniz zaman plan değiştirin
                        veya iptal edin.</p>
                </div>
                <div class="col-lg-4 text-lg-end">
                    <div class="d-flex gap-2 justify-content-start justify-content-lg-end">
                        <a class="btn btn-accent cta-btn" href="{% url 'accounts:register' %}?next=/accounting/home/"
                            data-cta="universal-cta-register">
                            <i class="bi bi-rocket-takeoff me-1" aria-hidden="true"></i> Hemen Başla
                        </a>
                        <a class="btn btn-outline-primary cta-btn" href="{% url 'billing:plans' %}"
                            data-cta="universal-cta-plans">
                            <i class="bi bi-credit-card me-1" aria-hidden="true"></i> Paketleri İncele
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
