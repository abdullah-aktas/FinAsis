{% load i18n %}
{% if actions %}
<div class="quick-actions-menu">
  <h6 class="mb-3">
    <i class="bi bi-lightning-charge text-warning me-2"></i>{% trans "Hızlı İşlemler" %}
  </h6>
  <div class="d-grid gap-2">
    {% for action in actions %}
      <a href="{% url action.url %}" class="btn btn-{{ action.color }} btn-sm">
        <i class="{{ action.icon }} me-2"></i>{{ action.name }}
      </a>
    {% endfor %}
  </div>
</div>
{% endif %}
