{% load bootstrap5 %}
{% if form.non_field_errors %}
  <div class="alert alert-danger">
    {% for error in form.non_field_errors %}
      <div>{{ error }}</div>
    {% endfor %}
  </div>
{% endif %}

<form method="{{ method|default:'post' }}" {% if enctype %}enctype="{{ enctype }}"{% endif %}
      class="needs-validation" novalidate onsubmit="return handleFormSubmit(this)">
  {% csrf_token %}
  {% bootstrap_form form layout='vertical' show_label=True show_help=True %}
  <div class="d-flex justify-content-end mt-3 position-relative">
    <button type="submit" class="btn btn-primary" id="submitBtn">
      <span id="submitText">{{ submit_label|default:_('Kaydet') }}</span>
      <div class="spinner-border spinner-border-sm ms-2 d-none" id="submitSpinner" role="status"></div>
    </button>
  </div>
</form>

<script>
function handleFormSubmit(form) {
  if (!form.checkValidity()) {
    form.classList.add('was-validated');
    return false;
  }
  document.getElementById('submitSpinner').classList.remove('d-none');
  document.getElementById('submitText').innerText = "Gönderiliyor...";
  return true;
}
</script>
