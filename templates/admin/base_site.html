{% extends "admin/base.html" %}
{% load static %}

{% block title %}FinAsis Yönetim Paneli{% endblock %}

{% block extrahead %}
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<style>
  /* Mobil uyumluluk için responsive CSS */
  @media (max-width: 768px) {
    .navbar {
      flex-wrap: wrap;
      padding: 0.5rem 1rem;
    }
    
    .navbar-brand {
      font-size: 1rem !important;
      padding: 0.25rem 0;
    }
    
    .navbar-brand img {
      height: 32px !important;
      width: auto;
    }
    
    .navbar-brand span {
      font-size: 1rem !important;
    }
    
    .navbar .d-flex {
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
      margin-top: 0.5rem;
    }
    
    .navbar form {
      width: 100%;
      margin: 0 !important;
    }
    
    .navbar form .form-control {
      width: 100%;
      margin-right: 0 !important;
      margin-bottom: 0.5rem;
    }
    
    .navbar .dropdown {
      width: 100%;
    }
    
    .navbar .btn {
      width: 100%;
      justify-content: center;
    }
    
    /* Admin içerik alanı */
    #content {
      padding: 0.5rem;
      overflow-x: auto;
    }
    
    .module {
      margin-bottom: 1rem;
    }
    
    table {
      font-size: 0.875rem;
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }
    
    /* Form alanları */
    .form-row {
      flex-direction: column;
    }
    
    .form-row > div {
      width: 100% !important;
      margin-bottom: 0.5rem;
    }
    
    /* Butonlar */
    .submit-row {
      flex-direction: column;
    }
    
    .submit-row input,
    .submit-row a {
      width: 100%;
      margin-bottom: 0.5rem;
    }
    
    /* Filtreler */
    #changelist-filter {
      position: relative;
      width: 100%;
      margin-top: 1rem;
    }
    
    /* Tablo responsive */
    .results {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  }
  
  @media (max-width: 480px) {
    .navbar-brand {
      font-size: 0.875rem !important;
    }
    
    .navbar-brand span {
      font-size: 0.875rem !important;
    }
    
    #content h1 {
      font-size: 1.25rem;
    }
    
    .object-tools {
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .object-tools a {
      width: 100%;
      text-align: center;
    }
  }
</style>
{% endblock %}

{% block branding %}
  <nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm" style="background: linear-gradient(90deg,#009688 0%, #00b894 100%);">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="{% url 'admin:index' %}">
        <img src="{% static 'common/FinAsis_logo.png' %}" alt="FinAsis Logo" height="40" class="me-2" style="max-width: 40px; height: auto;" onerror="this.style.display='none'">
        <span class="fw-bold text-white fs-4">FinAsis Admin</span>
      </a>
      <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-controls="adminNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNav">
        <form class="d-flex ms-auto me-3" role="search">
          <input class="form-control me-2" type="search" placeholder="Hızlı Arama" aria-label="Search">
          <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
        </form>
        <div class="d-flex align-items-center gap-3 flex-wrap">
          <span class="badge bg-warning text-dark">Yeni bildirim!</span>
          <div class="dropdown">
            <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle"></i> <span class="d-none d-md-inline">{{ user.username }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="{% url 'accounts:user_profile' %}">Profilim</a></li>
              <li>
                <form method="post" action="{% url 'accounts:logout' %}" class="px-3 py-1">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item">Çıkış Yap</button>
                </form>
              </li>
            </ul>
          </div>
          <button id="toggleDark" class="btn btn-sm btn-outline-light" type="button"><i class="bi bi-moon"></i></button>
        </div>
      </div>
    </div>
  </nav>
{% endblock %}

{% block usertools %}
  {{ block.super }}
{% endblock %}
