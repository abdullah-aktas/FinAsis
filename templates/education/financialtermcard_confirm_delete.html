{% extends "core_ui/base.html" %}
{% load static %}
{% block title %}Terimi Sil - FinAsis{% endblock %}

{% block extra_css %}
<style>
  .delete-card {
    background: white;
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    text-align: center;
  }

  .delete-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #ef4444;
  }
</style>
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row">
    <div class="col-lg-6 mx-auto">
      <div class="delete-card">
        <div class="delete-icon">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h2 style="font-weight: 800; margin-bottom: 12px;">Silmek istediğinize emin misiniz?</h2>
        <p style="color: #718096; font-size: 15px; margin-bottom: 32px;">{{ object }}</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-danger" type="submit" style="border-radius: 12px; padding: 12px 28px; font-weight: 600;">
              <i class="bi bi-trash me-2"></i>Evet, Sil
            </button>
            <a class="btn btn-outline-secondary" href="{% url 'education:financialtermcard_detail' object.pk %}" style="border-radius: 12px; padding: 12px 28px; font-weight: 600;">
              <i class="bi bi-x-lg me-2"></i>İptal
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
