<nav class="rbac-menu">
    <ul class="nav flex-column">
        {% for item in menu_items %}
            <li class="nav-item">
                {% if item.children %}
                    <!-- Dropdown menu -->
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="collapse" data-bs-target="#menu-{{ forloop.counter }}">
                        <i class="{{ item.icon }} me-2"></i>
                        {{ item.name }}
                    </a>
                    <div class="collapse" id="menu-{{ forloop.counter }}">
                        <ul class="nav flex-column ms-3">
                            {% for child in item.children %}
                                <li class="nav-item">
                                    <a class="nav-link" href="{{ child.url }}">
                                        <i class="{{ child.icon }} me-2"></i>
                                        {{ child.name }}
                                    </a>
                                </li>
                            {% endfor %}
                        </ul>
                    </div>
                {% else %}
                    <!-- Direct link -->
                    <a class="nav-link{% if item.active %} active{% endif %}" href="{{ item.url }}">
                        <i class="{{ item.icon }} me-2"></i>
                        {{ item.name }}
                    </a>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
    
    {% if role_info %}
    <div class="mt-3 p-2 bg-light rounded">
        <small class="text-muted">Rolünüz:</small><br>
        <span class="badge bg-{{ role_info.color }}">
            <i class="{{ role_info.icon }} me-1"></i>
            {{ role_info.description }}
        </span>
    </div>
    {% endif %}
</nav>
