{% extends "accounting/base.html" %}
{% block content %}
<h2>Muhtasar Beyanname Raporu ({{ period }})</h2>
<table class="table table-bordered">
    <thead>
        <tr>
            {% for col in df.columns %}
            <th>{{ col }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for row in df.values.tolist %}
        <tr>
            {% for val in row %}
            <td>{{ val }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="?period={{ period }}&excel=1" class="btn btn-success">Excel İndir</a>
<a href="?period={{ period }}&pdf=1" class="btn btn-danger">PDF İndir</a>
<a href="{% url 'accounting:declaration_report_list' %}" class="btn btn-secondary">Geri</a>
{% endblock %}
