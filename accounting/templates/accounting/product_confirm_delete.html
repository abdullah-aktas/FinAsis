{% extends "core_ui/base.html" %}
{% block title %}Ürün Sil{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Ürünü Sil</h2>
    <p><strong>{{ product.name }}</strong> adlı ürünü silmek istediğinize emin misiniz?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Evet, Sil</button>
        <a href="{% url 'accounting:product_list' %}" class="btn btn-secondary">Vazgeç</a>
    </form>
</div>
{% endblock %}
