  - id: auditor_sample_test
    audience: auditor
    kind: mission
    title: "Örneklem Testi"
    description: "Gelir ve gider kalemlerinden örnek seç, destekleyici belgeleri doğrula ve rapor özetini paylaş."
    icon: "bi-search"
    link:
      label: "Denetim Modülü"
      href: "/audit/samples/"
    reward:
      xp: 150
    tags: ["audit", "sampling"]

