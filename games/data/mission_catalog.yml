    link:
      label: "Rotanı Keşfet"
      href: "/education/career-paths/"
    reward:
      xp: 150
    tags: ["career", "reflection"]

  - id: gamer_daily_challenge
    audience: gamer
    kind: mission
    title: "Günlük Likidite Görevi"
    description: "Günlük görevde likidite oranını 1.25 üzerinde tutmayı başar."
    icon: "bi-lightning"
    link:
      label: "Göreve Git"
      href: "/games/quests/"
    reward:
      xp: 75
    tags: ["liquidity", "daily"]

  - id: gamer_simulation_link
    audience: gamer
    kind: simulation
    title: "Senaryo Simülasyonu"
    description: "Finansal simülasyonla oyun görevini bağla, sonuçları raporla."
    icon: "bi-cpu"
    link:
      label: "Simülasyon Başlat"
      href: "/finance/simulations/pricing/"
    reward:
      xp: 130
    tags: ["simulation", "reporting"]

  - id: gamer_leaderboard_push
    audience: gamer
    kind: challenge
    title: "Liderlik Sıçraması"
    description: "Üç finansal görevi zincir halinde tamamlayarak liderlik tablosunda yüksel."
    icon: "bi-trophy"
    link:
      label: "Liderlik Tablosu"
      href: "/games/leaderboard/"
    reward:
      xp: 100
    tags: ["leaderboard", "combo"]

