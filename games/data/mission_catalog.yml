    icon: "bi-graph-down"
    link:
      label: "Tasarruf Paneli"
      href: "/finance/insights/expense-optimizer/"
    reward:
      xp: 150
    tags: ["cost", "strategy"]

  - id: employee_invoice_onboarding
    audience: kobi_employee
    kind: onboarding
    title: "Fatura Süreci Onboarding"
