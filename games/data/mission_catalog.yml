    audience: admin
    kind: challenge
    title: "Incident Drill"
    description: "Test ortamında simüle edilmiş kesintiye karşı runbook uygula, kesinti süresini ve çözüm adımlarını raporla."
    icon: "bi-activity"
    link:
      label: "Runbook'u Aç"
      href: "/management/ops/runbooks/incident-drill/"
    reward:
      xp: 160
    tags: ["sre", "playbook"]

