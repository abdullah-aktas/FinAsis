      href: "/management/support/queue/"
    reward:
      xp: 70
    tags: ["support", "customer"]

  - id: finance_manager_treasury_huddle
    audience: finance_manager
    kind: mission
    title: "Hazine Huddle"
    description: "Banka bakiyelerini konsolide et, kısa vadeli likidite ihtiyacını hesapla ve önerilen transfer planını oluştur."
    icon: "bi-bank"
    link:
      label: "Banka Panosu"
      href: "/finance/banking/"
    reward:
      xp: 180
    tags: ["treasury", "liquidity"]

  - id: finance_manager_approval_wave
    audience: finance_manager
    kind: challenge
    title: "Onay Dalgası"
    description: "Bekleyen ödeme taleplerini değerlendirmek için bayi, gider ve maaş kalemlerinden en az üçünü onayla veya reddet."
    icon: "bi-check2-square"
    link:
      label: "Onay Kuyruğu"
      href: "/accounting/approvals/"
    reward:
      xp: 130
    tags: ["approval", "workflow"]

