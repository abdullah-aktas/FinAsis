    audience: accountant
    kind: mission
    title: "Dönem Kapanışı"
    description: "Açık faturaları temizle, mutabakat raporu üret ve kapanış defterini PDF olarak paydaşlara gönder."
    icon: "bi-archive"
    link:
      label: "Kapanış Asistanı"
      href: "/accounting/period-close/"
    reward:
      xp: 200
    tags: ["close", "reporting"]

  - id: accountant_vat_checklist
    audience: accountant
    kind: checklist
    title: "KDV Beyanname Kontrolü"
    description: "Beyanname taslağını doğrula, eksik evrakları müşteriyle paylaş ve gönderim öncesi kontrol listelerini tamamla."
    icon: "bi-list-check"
    link:
      label: "KDV Paneli"
      href: "/accounting/vat/"
    reward:
      xp: 110
    tags: ["vat", "compliance"]

