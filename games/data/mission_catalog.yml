    audience: admin
    kind: mission
    title: "Operasyonel Dayanıklılık Denetimi"
    description: "Üretim öncesi kritik modüllerde health check çalıştır, Sentry/PROM loglarını gözden geçir, riskli bulgular için görev aç."
    icon: "bi-shield-lock"
    link:
      label: "Durum Panosu"
      href: "/management/ops/health-check/"
    reward:
      xp: 140
    tags: ["ops", "compliance", "release"]

