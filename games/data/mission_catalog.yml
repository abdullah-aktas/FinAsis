    icon: "bi-journal-plus"
    link:
      label: "Ders Planını Aç"
      href: "/education/courses/planner/"
    reward:
      xp: 120
    tags: ["lesson", "planning", "academy"]

  - id: teacher_mission_bridge
    audience: teacher
    kind: mission
    title: "Görev Köprüsü"
