{% extends "core_ui/base.html" %}
{% block content %}
<h1>Oyunlar</h1>
<ul>
  {% for game in games %}
    <li>
      <a href="{% url 'games:game_detail' game.id %}">{{ game.name }}</a>
      <p>{{ game.description|truncatewords:20 }}</p>
    </li>
  {% empty %}
    <li>Henüz oyun eklenmemiş.</li>
  {% endfor %}
</ul>
{% endblock %}
