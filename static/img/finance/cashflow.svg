<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Nakit akışı illüstrasyonu">
  <rect width="640" height="360" fill="#eefafc"/>
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="520" height="240" rx="16" fill="#ffffff" stroke="#d6eef6"/>
    <!-- timeline -->
    <line x1="40" y1="180" x2="480" y2="180" stroke="#bfe6f1" stroke-width="3"/>
    <!-- arrows representing cash in/out -->
    <path d="M60,200 C100,140 140,140 180,200" fill="none" stroke="#3eb0c9" stroke-width="6"/>
    <polygon points="180,200 170,190 194,190" fill="#3eb0c9"/>
    <path d="M220,160 C260,220 300,220 340,160" fill="none" stroke="#21b49a" stroke-width="6"/>
    <polygon points="340,160 330,170 354,170" fill="#21b49a"/>
    <path d="M380,200 C410,150 440,150 470,190" fill="none" stroke="#2193b0" stroke-width="6"/>
    <polygon points="470,190 460,180 484,180" fill="#2193b0"/>
    <!-- labels -->
    <rect x="40" y="24" width="160" height="28" rx="8" fill="#e8f6fb"/>
    <rect x="220" y="24" width="120" height="28" rx="8" fill="#e8f6fb"/>
    <rect x="360" y="24" width="160" height="28" rx="8" fill="#e8f6fb"/>
    <text x="120" y="43" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#1f2937">Gelir</text>
    <text x="280" y="43" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#1f2937">Gider</text>
    <text x="440" y="43" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#1f2937">Nakit</text>
  </g>
</svg>