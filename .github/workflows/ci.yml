name: CI

on:
  push:
    branches: [ main, master, develop, restore-30-eylul ]
  pull_request:
    branches: [ main, master, develop, restore-30-eylul ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pre-commit pyright

      - name: Run pre-commit (lint/format)
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Type check (pyright)
        run: |
          pyright

      - name: Django checks and migrations (sqlite)
        env:
          DJANGO_SETTINGS_MODULE: src.config.settings
          SECRET_KEY: test-secret
          USE_SQLITE: "1"
          DEBUG: "0"
        run: |
          python manage.py check --deploy --fail-level WARNING || true
          python manage.py migrate --noinput

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: src.config.settings
          SECRET_KEY: test-secret
          USE_SQLITE: "1"
          DEBUG: "0"
        run: |
          pytest -q --maxfail=1 --disable-warnings --cov=. --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
