name: Proje Hazırlık Kontrolü (Project Readiness Check)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Manuel tetikleme için

jobs:
  readiness-check:
    name: Django Proje Hazırlık Kontrolü
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - name: 📥 Repository'yi çek
      uses: actions/checkout@v4
    
    - name: 🐍 Python ${{ matrix.python-version }} kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: 📦 Bağımlılıkları yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔧 Django ortam değişkenlerini ayarla
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DJANGO_SECRET_KEY: test-secret-key-for-ci-cd-only
        DJANGO_DEBUG: "False"
        DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      run: |
        echo "Django ortam değişkenleri ayarlandı"
    
    - name: 🗄️ Veritabanı migration'larını uygula
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DJANGO_SECRET_KEY: test-secret-key-for-ci-cd-only
        DJANGO_DEBUG: "False"
      run: |
        python manage.py migrate --noinput
    
    - name: ✅ Proje Hazırlık Kontrol Scriptini Çalıştır
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DJANGO_SECRET_KEY: test-secret-key-for-ci-cd-only
        DJANGO_DEBUG: "False"
        DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      run: |
        python project_readiness_check.py
    
    - name: 📊 Test Sonuçlarını Özetle
      if: always()
      run: |
        echo "## 🎯 Python ${{ matrix.python-version }} Test Sonuçları" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Tüm kontroller tamamlandı!" >> $GITHUB_STEP_SUMMARY

  summary:
    name: 📋 Genel Özet
    runs-on: ubuntu-latest
    needs: readiness-check
    if: always()
    
    steps:
    - name: ✅ Durum Özeti
      run: |
        echo "## 🎉 Proje Hazırlık Kontrolü Tamamlandı" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Tüm Python versiyonları için kontroller tamamlandı." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Kontrol Edilenler:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Django sistem kontrolleri" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Migration durumu" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ URL haritası" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Smoke testler (model/view/template/admin)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Static dosyalar (collectstatic dry-run)" >> $GITHUB_STEP_SUMMARY

