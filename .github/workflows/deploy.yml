name: Deploy to Cloud Run

# Bu workflow Cloud Build trigger'ı REST API ile tetikler.
# Cloud Build trigger otomatik olarak main branch'e push yapıldığında da çalışır.

on:
  workflow_dispatch:  # Sadece manuel tetikleme

env:
  PROJECT_ID: finasis-478502
  SERVICE_NAME: finasis-prod
  IMAGE_SERVICE: finasis-api
  REGION: europe-west1
  REPOSITORY: finasis-app
  TRIGGER_NAME: finasis-prod-europe-west1-abdullah-aktas-FinAsis

jobs:
  deploy:
    name: Trigger Cloud Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}

      - name: Trigger Cloud Build
        run: |
          echo "🚀 Cloud Build trigger'ı tetikleniyor..."
          
          # Trigger'ı bul
          TRIGGER_ID=$(gcloud builds triggers list \
            --filter="name:${{ env.TRIGGER_NAME }}" \
            --format="value(id)" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} | head -1)
          
          if [ -z "$TRIGGER_ID" ]; then
            echo "⚠️  Trigger bulunamadı, tüm trigger'ları listeliyorum..."
            gcloud builds triggers list --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }}
            echo ""
            echo "✅ Cloud Build trigger otomatik olarak çalışacak (push tetiklemesi)."
            echo "📊 Build durumunu takip edin:"
            echo "   https://console.cloud.google.com/cloud-build/builds?project=${{ env.PROJECT_ID }}"
            exit 0
          fi
          
          echo "📋 Trigger ID: $TRIGGER_ID"
          
          # Trigger'ı tetikle
          gcloud builds triggers run $TRIGGER_ID \
            --branch=main \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} || {
            echo "⚠️  Trigger tetiklenemedi, ama Cloud Build otomatik olarak çalışacak."
            echo "📊 Build durumunu takip edin:"
            echo "   https://console.cloud.google.com/cloud-build/builds?project=${{ env.PROJECT_ID }}"
            exit 0
          }
          
          echo "✅ Cloud Build trigger başarıyla tetiklendi!"
          echo "📊 Build durumunu takip edin:"
          echo "   https://console.cloud.google.com/cloud-build/builds?project=${{ env.PROJECT_ID }}"
