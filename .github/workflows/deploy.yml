name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "**.html"
      - "**.js"
      - "**.css"
      - "Dockerfile"
      - "requirements.txt"
      - "deploy/**"
      - "config/**"
      - "common/**"
      - "accounts/**"
  workflow_dispatch:

env:
  PROJECT_ID: finasis-478502
  SERVICE_NAME: finasis-prod          # Cloud Run service name
  IMAGE_SERVICE: finasis-api          # Container image name
  REGION: europe-west1
  REPOSITORY: finasis-app

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Clear Google Auth Override
        run: |
          gcloud config unset auth/credential_file_override || true
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_GHA_CREDS_PATH || true
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Debug gcloud config
        run: |
           echo "🔍 gcloud config list"
           gcloud config list || true
           echo "🔍 gcloud auth list"
           gcloud auth list || true
           echo "🔍 active account"
           gcloud config get-value account || true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Submit build to Cloud Build
        run: |
          gcloud builds submit \
            --config=deploy/cloud_run/cloudbuild.yaml \
            --region=${{ env.REGION }} \
            --substitutions=_SERVICE=${{ env.IMAGE_SERVICE }},_CLOUD_RUN_SERVICE=${{ env.SERVICE_NAME }},_REGION=${{ env.REGION }},_REPOSITORY=${{ env.REPOSITORY }},_CLOUD_SQL_CONNECTION="${{ secrets.CLOUD_SQL_CONNECTION }}",_CLOUD_RUN_ENV_VARS="${{ secrets.CLOUD_RUN_ENV_VARS }}",_CLOUD_RUN_SECRETS="${{ secrets.CLOUD_RUN_SECRETS }}" \
            --project=${{ env.PROJECT_ID }}
