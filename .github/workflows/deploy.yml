name: Deploy to Cloud Run

on:
  workflow_dispatch: # Manuel tetikleme
  push:
    branches:
      - main # main branch'e push olduğunda otomatik deploy

env:
  PROJECT_ID: finasis-478502
  SERVICE_NAME: finasis-prod
  REGION: europe-west1
  REPOSITORY: finasis-app
  IMAGE_NAME: finasis-api

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DB_PASSWORD: ${{ secrets.DJANGO_DB_PASSWORD }}
        run: |
          # Secret kontrolü
          if [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "❌ ERROR: DJANGO_SECRET_KEY is not set in GitHub Secrets!"
            echo "Please add it in: Settings → Secrets and variables → Actions"
            exit 1
          fi

          if [ -z "$DJANGO_DB_PASSWORD" ]; then
            echo "❌ ERROR: DJANGO_DB_PASSWORD is not set in GitHub Secrets!"
            echo "Please add it in: Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "✅ Secrets are set (length check: SECRET_KEY=${#DJANGO_SECRET_KEY} chars, DB_PASSWORD=${#DJANGO_DB_PASSWORD} chars)"

          # Environment variables'ı hazırla
          ENV_VARS="MPLCONFIGDIR=/tmp/matplotlib-cache,PYTHONUNBUFFERED=1,PYTHONDONTWRITEBYTECODE=1,DJANGO_DB_ENGINE=django.db.backends.postgresql,DJANGO_DB_NAME=finasis,DJANGO_DB_USER=finasis-app,DJANGO_DB_HOST=/cloudsql/finasis-478502:europe-west1:finasis-db,CLOUD_SQL_CONNECTION_NAME=finasis-478502:europe-west1:finasis-db,DJANGO_DEBUG=0,CLOUD_RUN_HOST=finasis-prod-s3kju7bqua-ew.a.run.app"

          # SECRET_KEY ve DB_PASSWORD'i ekle
          ENV_VARS="$ENV_VARS,DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
          ENV_VARS="$ENV_VARS,DJANGO_DB_PASSWORD=$DJANGO_DB_PASSWORD"

          echo "🔧 Deploying with environment variables..."

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --execution-environment=gen2 \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300 \
            --concurrency=40 \
            --min-instances=1 \
            --max-instances=10 \
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --add-cloudsql-instances=finasis-478502:europe-west1:finasis-db \
            --cpu-boost \
            --cpu-throttling \
            --startup-cpu-boost \
            --set-env-vars="$ENV_VARS" \
            --project=${{ env.PROJECT_ID }}

      - name: Show service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "✅ Deployment tamamlandı!"
          echo "🌐 Servis URL: $SERVICE_URL"
