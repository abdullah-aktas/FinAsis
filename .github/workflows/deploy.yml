name: Deploy to Cloud Run

on:
  workflow_dispatch: # Manuel tetikleme
  push:
    branches:
      - main # main branch'e push olduğunda otomatik deploy

env:
  PROJECT_ID: finasis-478502
  SERVICE_NAME: finasis-prod
  REGION: europe-west1
  REPOSITORY: finasis-app
  IMAGE_NAME: finasis-api

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --platform=managed
            --allow-unauthenticated
            --execution-environment=gen2
            --memory=2Gi
            --cpu=2
            --timeout=300
            --concurrency=40
            --min-instances=1
            --max-instances=10
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=finasis-478502:europe-west1:finasis-db
          env_vars: |
            MPLCONFIGDIR=/tmp/matplotlib-cache
            PYTHONUNBUFFERED=1
            PYTHONDONTWRITEBYTECODE=1
            DJANGO_DB_ENGINE=django.db.backends.postgresql
            DJANGO_DB_NAME=finasis
            DJANGO_DB_USER=finasis-app
            DJANGO_DB_HOST=/cloudsql/finasis-478502:europe-west1:finasis-db
            DJANGO_DEBUG=0
          secrets: ${{ secrets.CLOUD_RUN_SECRETS }}

      - name: Show service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "✅ Deployment tamamlandı!"
          echo "🌐 Servis URL: $SERVICE_URL"
