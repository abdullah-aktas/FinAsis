{% extends "management/base_admin.html" %}
{% load crispy_forms_tags %}
{% block admin_content %}
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="font-weight: 800; color: #1a202c;">
            <i class="bi bi-building-add me-2"></i>
            {% if edit %}Şirketi Düzenle{% else %}Yeni Şirket Ekle{% endif %}
        </h2>
        <a href="{% url 'management:company_list' %}" class="btn btn-secondary" style="border-radius: 12px;">
            <i class="bi bi-arrow-left me-2"></i>Geri Dön
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 16px;">
        <div class="card-body p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary" style="border-radius: 12px; font-weight: 600;">
                        <i class="bi bi-check-lg me-2"></i>Kaydet
                    </button>
                    <a href="{% url 'management:company_list' %}" class="btn btn-outline-secondary" style="border-radius: 12px;">
                        İptal
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
