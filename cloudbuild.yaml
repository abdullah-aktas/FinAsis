timeout: "1800s"
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PYTHON_VERSION: "3.11"

steps:
  - name: "python:${_PYTHON_VERSION}"
    id: "Install dependencies and run readiness check"
    entrypoint: "bash"
    env:
      - "DJANGO_SETTINGS_MODULE=config.settings"
      - "DJANGO_SECRET_KEY=test-secret-key-for-cloud-build"
      - "DJANGO_DEBUG=False"
      - "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1"
      # Not: Migration'lar Cloud Run container başlatılırken deploy/entrypoint.sh içinde çalışır
      # Cloud Build'de sadece kod kontrolleri yapıyoruz, veritabanı bağlantısı gerektirmez
    args:
      - "-c"
      - | 
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt
        # Temizlik
        pip cache purge || true
        rm -rf /tmp/* /var/tmp/* ~/.cache/pip || true
        # Temel Django kontrolleri (veritabanı gerektirmez)
        python manage.py check --deploy || echo "Warning: Django check failed, continuing..."
        # Migration dosyalarının syntax kontrolü (veritabanı gerektirmez)
        python manage.py makemigrations --check --dry-run || echo "Warning: Unapplied migrations detected, continuing..."
        # Static dosyaların toplanabilirliğini kontrol et (dry-run, veritabanı gerektirmez)
        python manage.py collectstatic --dry-run --noinput || echo "Warning: collectstatic dry-run failed, continuing..."

images: []

